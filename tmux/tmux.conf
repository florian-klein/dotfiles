# Self-contained config: no plugins, safe to copy to any remote host.
# kitten ssh copies this file + kitty terminfo on every connection (see
# ~/.config/kitty/ssh.conf), so changes propagate on the next ssh.
# Prefix stays C-b: kitty's cmd+left sends C-a, which would trigger a C-a prefix.

# ═══ Core ════════════════════════════════════════════════════════════════
# Mouse support — selections respect pane boundaries
set -g mouse on

# Use system clipboard via OSC 52 (works over SSH with kitty)
set -g set-clipboard on

# Increase scrollback
set -g history-limit 50000

# Reduce escape delay (feels sluggish otherwise, especially over SSH)
set -sg escape-time 10

# Pass focus events through (nvim autoread, shell integrations)
set -g focus-events on

# Resize to the smallest client actually viewing a window, not just attached
setw -g aggressive-resize on

# Start window/pane numbering at 1, renumber when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Killing a session switches to another instead of detaching
set -g detach-on-destroy off

# Messages stay up long enough to read
set -g display-time 2000

# ═══ Terminal / kitty integration ══════════════════════════════════════════
# tmux-256color where the host has the terminfo, fallback for older boxes
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# kitty outer terminal: true color, styled underlines, OSC 8 hyperlinks,
# extended keys, OSC 52 clipboard (terminfo is copied by kitten ssh)
set -as terminal-features ',xterm-kitty:RGB:usstyle:hyperlinks:extkeys:clipboard'
set -ga terminal-overrides ',xterm-256color:Tc'

# Claude Code: let desktop notifications, the progress bar and Shift+Enter
# pass through tmux to the outer terminal (kitty)
set -g allow-passthrough on
set -s extended-keys on

# Propagate titles to kitty's tab bar: session:window — host
set -g set-titles on
set -g set-titles-string '#S:#W — #h'

# ═══ Keybindings ════════════════════════════════════════════════════════════
# Reload config
bind r source-file ~/.tmux.conf \; display 'config reloaded'

# Splits and new windows inherit the current directory
# | and - mirror kitty's vsplit/hsplit ( % and " still work too)
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Vim-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# l normally means "last window"; that moves to prefix + Tab
bind Tab last-window

# Repeatable pane resizing (prefix + H/J/K/L, keep tapping)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window switching without prefix: Shift+Left / Shift+Right
# (Alt bindings don't survive kitty's opt+arrow word-movement mappings)
bind -n S-Left previous-window
bind -n S-Right next-window

# Zoom pane (prefix + z is default; f as a mnemonic "fullscreen" too)
bind f resize-pane -Z

# ═══ Copy mode (vi keys) ═══════════════════════════════════════════════════
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# Mouse drag also copies straight to the system clipboard via OSC 52

# ═══ Activity ════════════════════════════════════════════════════════════════
# Highlight windows with activity in the status bar, but no popup messages
set -g monitor-activity on
set -g visual-activity off

# ═══ Status bar (Gruvbox accents, transparent background) ═══════════════════
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=default,fg=#ebdbb2'

set -g status-left-length 32
set -g status-left '#[fg=#1d2021,bg=#fe8019,bold] #S #[fg=default,bg=default] '

setw -g window-status-format '#[fg=#a89984] #I:#W '
setw -g window-status-current-format '#[fg=#1d2021,bg=#fabd2f,bold] #I:#W '
setw -g window-status-activity-style 'fg=#fb4934,bold'

# Hostname on the right — always know which box you're on over SSH
set -g status-right-length 48
set -g status-right '#[fg=#a89984]#h #[fg=#fabd2f,bold]%H:%M '

# Pane borders and messages
set -g pane-border-style 'fg=#3c3836'
set -g pane-active-border-style 'fg=#fe8019'
set -g message-style 'fg=#ebdbb2,bg=#3c3836'
setw -g mode-style 'fg=#1d2021,bg=#fe8019'
