# kitten ssh: files copied to every remote host on connect (overwriting).
# Remote dotfile sources live in ~/.config/kitty/remote/ — edit them there.

# tmux config (mouse mode, clipboard, kitty terminal features)
copy .tmux.conf

# Full zsh environment: zshrc + prompt config + one-time tool bootstrap
copy --dest=.zshrc .config/kitty/remote/zshrc
copy --dest=.zsh-bootstrap.sh .config/kitty/remote/bootstrap.sh
copy .p10k.zsh

# bash handoff: hosts whose login shell is bash bootstrap + exec zsh automatically
copy --dest=.bashrc .config/kitty/remote/bashrc
copy --dest=.bash_profile .config/kitty/remote/bash_profile

# Reuse SSH connections for faster subsequent connects
share_connections yes
